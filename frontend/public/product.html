<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">产品详情 - 南竹竹制品</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css?v=1.0.2">
    <style>
        .detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .breadcrumb {
            padding: 20px 0;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-bottom: 60px;
        }

        @media (max-width: 768px) {
            .product-detail {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        .detail-image-container {
            position: relative;
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .detail-image {
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-category {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(34, 139, 34, 0.1);
            color: var(--primary-color);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            width: fit-content;
        }

        .detail-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .detail-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .detail-description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-gray);
            margin-bottom: 40px;
        }

        .detail-specs {
            background: var(--light-gray);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .detail-specs h3 {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .spec-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .spec-item:last-child {
            border-bottom: none;
        }

        .spec-label {
            font-weight: 500;
            color: var(--text-gray);
            min-width: 120px;
        }

        .spec-value {
            color: var(--text-dark);
        }

        .detail-actions {
            display: flex;
            gap: 20px;
            margin-top: auto;
        }

        .btn-primary {
            flex: 1.2;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: var(--white);
            border: none;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(34, 139, 34, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(34, 139, 34, 0.4);
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-outline {
            flex: 0.8;
            padding: 18px 32px;
            background: transparent;
            color: var(--text-dark);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-outline:hover {
            background: var(--light-gray);
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        .btn-outline:active {
            transform: translateY(-1px);
        }

        .related-products {
            margin-top: 60px;
        }

        .related-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 40px;
            text-align: center;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .related-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .related-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .related-card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .related-card-info {
            padding: 20px;
        }

        .related-card-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .related-card-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.2rem;
            color: var(--text-gray);
        }

        .error-message {
            text-align: center;
            padding: 100px 20px;
        }

        .error-message h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        .error-message p {
            color: var(--text-gray);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-logo">
                <span class="logo-text">南竹</span>
            </a>
            <ul class="navbar-menu">
                <li><a href="/" class="nav-link">首页</a></li>
                <li><a href="/#products" class="nav-link">产品中心</a></li>
                <li><a href="/#about" class="nav-link">关于我们</a></li>
                <li><a href="/#contact" class="nav-link">联系我们</a></li>
            </ul>
            <button class="navbar-toggle" id="navbarToggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </nav>

    <main class="detail-container">
        <div class="breadcrumb">
            <a href="/">首页</a> / <a href="/#products">产品中心</a> / <span id="breadcrumbName">加载中...</span>
        </div>

        <div id="productContent">
            <div class="loading">
                正在加载产品信息...
            </div>
        </div>

        <section class="related-products" id="relatedSection" style="display: none;">
            <h2 class="related-title">相关产品</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-brand">
                <span class="logo-text">南竹</span>
                <p>自然之美，匠心传承</p>
            </div>
            <div class="footer-links">
                <h4>快速链接</h4>
                <ul>
                    <li><a href="/">首页</a></li>
                    <li><a href="/#products">产品中心</a></li>
                    <li><a href="/#about">关于我们</a></li>
                    <li><a href="/#contact">联系我们</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <h4>产品分类</h4>
                <ul>
                    <li><a href="/#products">竹制厨具</a></li>
                    <li><a href="/#products">竹制家居</a></li>
                    <li><a href="/#products">竹制工艺品</a></li>
                    <li><a href="/#products">办公用品</a></li>
                </ul>
            </div>
            <div class="footer-contact">
                <h4>联系方式</h4>
                <p id="footer-phone">电话：0597-1234567</p>
                <p id="footer-email">邮箱：contact@nanzhu-bamboo.com</p>
                <p id="footer-address">地址：福建省龙岩市长汀县工业园区</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2024 长汀县南竹竹制品有限公司 版权所有</p>
        </div>
    </footer>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        async function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                showError('缺少产品ID参数');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/products`);
                if (!response.ok) throw new Error('获取产品列表失败');

                const products = await response.json();
                const product = products.find(p => p.id === parseInt(productId));

                if (!product) {
                    showError('未找到该产品');
                    return;
                }

                displayProductDetail(product);
                loadRelatedProducts(products, product);
                loadSettings();
            } catch (error) {
                console.error('Error loading product:', error);
                showError('加载产品信息失败，请稍后重试');
            }
        }

        function displayProductDetail(product) {
            const categoryNames = {
                kitchen: '竹制厨具',
                home: '竹制家居',
                craft: '竹制工艺品',
                office: '办公用品'
            };

            document.getElementById('pageTitle').textContent = `${product.name} - 南竹竹制品`;
            document.getElementById('breadcrumbName').textContent = product.name;

            const content = `
                <div class="product-detail">
                    <div class="detail-image-container">
                        <img src="${product.image}" alt="${product.name}" class="detail-image" 
                             onerror="this.src='https://via.placeholder.com/600x600/228B22/ffffff?text=${encodeURIComponent(product.name)}'">
                    </div>
                    <div class="detail-info">
                        <span class="product-category">${categoryNames[product.category] || product.category}</span>
                        <h1 class="detail-name">${product.name}</h1>
                        <div class="detail-price">¥${product.price.toFixed(2)}</div>
                        <p class="detail-description">${product.description}</p>
                        
                        ${product.specs ? `
                            <div class="detail-specs">
                                <h3>产品参数</h3>
                                ${product.specs.split('\n').map(spec => {
                                    const [key, value] = spec.split(':');
                                    return value ? `
                                        <div class="spec-item">
                                            <span class="spec-label">${key.trim()}</span>
                                            <span class="spec-value">${value.trim()}</span>
                                        </div>
                                    ` : '';
                                }).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="detail-actions">
                            <button class="btn-primary" onclick="contactUs()">联系我们</button>
                            <button class="btn-outline" onclick="goBack()">返回列表</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('productContent').innerHTML = content;
        }

        function loadRelatedProducts(allProducts, currentProduct) {
            const related = allProducts
                .filter(p => p.id !== currentProduct.id && p.category === currentProduct.category)
                .slice(0, 3);

            if (related.length === 0) {
                document.getElementById('relatedSection').style.display = 'none';
                return;
            }

            const grid = document.getElementById('relatedGrid');
            grid.innerHTML = related.map(product => `
                <div class="related-card" onclick="viewProduct(${product.id})">
                    <img src="${product.image}" alt="${product.name}" class="related-card-image"
                         onerror="this.src='https://via.placeholder.com/300x200/228B22/ffffff?text=${encodeURIComponent(product.name)}'">
                    <div class="related-card-info">
                        <h3 class="related-card-name">${product.name}</h3>
                        <div class="related-card-price">¥${product.price.toFixed(2)}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('relatedSection').style.display = 'block';
        }

        async function loadSettings() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/settings`);
                if (response.ok) {
                    const settings = await response.json();
                    document.getElementById('footer-phone').textContent = `电话：${settings.contact_phone || '0597-1234567'}`;
                    document.getElementById('footer-email').textContent = `邮箱：${settings.contact_email || 'contact@nanzhu-bamboo.com'}`;
                    document.getElementById('footer-address').textContent = `地址：${settings.contact_address || '福建省龙岩市长汀县工业园区'}`;
                }
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
        }

        function viewProduct(id) {
            window.location.href = `/product.html?id=${id}`;
        }

        function contactUs() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            const productName = document.getElementById('breadcrumbName').textContent;
            
            let targetUrl = '/contact.html';
            if (productId && productName !== '加载中...') {
                targetUrl += `?productId=${productId}&productName=${encodeURIComponent(productName)}`;
            }
            
            window.location.href = targetUrl;
        }

        function goBack() {
            window.location.href = '/#products';
        }

        function showError(message) {
            document.getElementById('productContent').innerHTML = `
                <div class="error-message">
                    <h2>出错了</h2>
                    <p>${message}</p>
                    <button class="btn-primary" onclick="goBack()">返回产品列表</button>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>

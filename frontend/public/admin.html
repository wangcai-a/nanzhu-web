<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南竹管理系统 - 管理后台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-container">
            <div class="login-header">
                <h1>南竹管理系统</h1>
                <p>长汀县南竹竹制品有限公司</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn">登 录</button>
            </form>
        </div>
    </div>

    <div id="adminPage" class="admin-page hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>南竹管理</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item active" data-page="dashboard">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">仪表盘</span>
                    </li>
                    <li class="nav-item" data-page="products">
                        <span class="nav-icon">📦</span>
                        <span class="nav-text">产品管理</span>
                    </li>
                    <li class="nav-item" data-page="messages">
                        <span class="nav-icon">💬</span>
                        <span class="nav-text">留言管理</span>
                        <span class="badge" id="messageBadge">0</span>
                    </li>
                    <li class="nav-item" data-page="settings">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-text">系统设置</span>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <span>🚪</span> 退出登录
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1 id="pageTitle">仪表盘</h1>
                <div class="header-actions">
                    <span class="current-time" id="currentTime"></span>
                </div>
            </header>

            <div class="content-body">
                <div id="dashboardPage" class="page-section active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">📦</div>
                            <div class="stat-info">
                                <div class="stat-value" id="productCount">0</div>
                                <div class="stat-label">产品总数</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">💬</div>
                            <div class="stat-info">
                                <div class="stat-value" id="messageCount">0</div>
                                <div class="stat-label">未处理留言</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">👁️</div>
                            <div class="stat-info">
                                <div class="stat-value">1,234</div>
                                <div class="stat-label">本月访问</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">⭐</div>
                            <div class="stat-info">
                                <div class="stat-value">98%</div>
                                <div class="stat-label">客户满意度</div>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <h3>快捷操作</h3>
                            <div class="quick-actions">
                                <button class="quick-btn" onclick="navigateTo('products')"><span>➕</span> 添加产品</button>
                                <button class="quick-btn" onclick="navigateTo('messages')"><span>📧</span> 查看留言</button>
                            </div>
                        </div>

                        <div class="dashboard-card">
                            <h3>最新留言</h3>
                            <div id="latestMessages" class="latest-list"></div>
                        </div>

                        <div class="dashboard-card">
                            <h3>产品分类统计</h3>
                            <div id="categoryStats" class="category-list"></div>
                        </div>
                    </div>
                </div>

                <div id="productsPage" class="page-section">
                    <div class="page-toolbar">
                        <div class="toolbar-left">
                            <button class="toolbar-btn primary" onclick="showProductModal()">
                                <span>➕</span> 添加产品
                            </button>
                        </div>
                        <div class="toolbar-right">
                            <input type="text" id="productSearch" class="search-input" placeholder="搜索产品...">
                            <select id="categoryFilter" class="filter-select">
                                <option value="">全部分类</option>
                                <option value="kitchen">竹制厨具</option>
                                <option value="home">竹制家居</option>
                                <option value="craft">竹制工艺品</option>
                                <option value="office">办公用品</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>产品图片</th>
                                    <th>产品名称</th>
                                    <th>分类</th>
                                    <th>价格</th>
                                    <th>描述</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="messagesPage" class="page-section">
                    <div class="page-toolbar">
                        <select id="messageFilter" class="filter-select">
                            <option value="">全部状态</option>
                            <option value="pending">待处理</option>
                            <option value="processed">已处理</option>
                        </select>
                        <input type="text" id="messageSearch" class="search-input" placeholder="搜索留言...">
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>姓名</th>
                                    <th>邮箱</th>
                                    <th>电话</th>
                                    <th>留言内容</th>
                                    <th>时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="messagesTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <div id="settingsPage" class="page-section">
                    <div class="settings-container">
                        <div class="settings-card">
                            <h3>账号设置</h3>
                            <form id="accountForm">
                                <div class="form-group">
                                    <label>当前用户名</label>
                                    <input type="text" value="admin" disabled>
                                </div>
                                <div class="form-group">
                                    <label for="currentPassword">当前密码</label>
                                    <input type="password" id="currentPassword" placeholder="请输入当前密码">
                                </div>
                                <div class="form-group">
                                    <label for="newPassword">新密码</label>
                                    <input type="password" id="newPassword" placeholder="请输入新密码">
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">确认新密码</label>
                                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                                </div>
                                <button type="submit" class="save-btn">修改密码</button>
                            </form>
                        </div>

                        <div class="settings-card">
                            <h3>数据管理</h3>
                            <div class="data-actions">
                                <button class="toolbar-btn" onclick="exportData()"><span>📤</span> 导出数据</button>
                                <button class="toolbar-btn danger" onclick="clearMessages()"><span>🗑️</span> 清空留言</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="productModalTitle">添加产品</h3>
                <button class="modal-close" onclick="closeProductModal()">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">产品名称 *</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">产品分类 *</label>
                        <select id="productCategory" required>
                            <option value="">请选择</option>
                            <option value="kitchen">竹制厨具</option>
                            <option value="home">竹制家居</option>
                            <option value="craft">竹制工艺品</option>
                            <option value="office">办公用品</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">价格 (元) *</label>
                        <input type="number" id="productPrice" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="productDescription">产品描述 *</label>
                    <textarea id="productDescription" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="productImage">产品图片 URL *</label>
                    <input type="url" id="productImage" placeholder="https://..." required>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeProductModal()">取消</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="messageModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>留言详情</h3>
                <button class="modal-close" onclick="closeMessageModal()">&times;</button>
            </div>
            <div class="message-detail" id="messageDetail"></div>
            <div class="form-actions">
                <button class="cancel-btn" onclick="closeMessageModal()">关闭</button>
                <button class="save-btn" id="processMessageBtn" onclick="processMessage()">标记已处理</button>
            </div>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
